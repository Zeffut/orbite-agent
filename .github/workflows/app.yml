name: App

# Orbite's app for phones and computers, built for each system it runs on.
# All of it is Rust: no other toolchain is involved.
on:
  push:
    branches: [app, main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  desktop:
    name: Computer (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.system }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - if: runner.os == 'Linux'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-${{ runner.os }}
          path: |
            app/target/release/bundle/**/*.deb
            app/target/release/bundle/**/*.AppImage
            app/target/release/bundle/**/*.dmg
            app/target/release/bundle/**/*.msi
            app/target/release/bundle/**/*.exe
          if-no-files-found: error

  # What was built for computers is put where anyone can fetch it: one
  # release, replaced by each build of the app's branch, and never the one
  # the installer takes Orbite itself from.
  publish:
    name: Publish the computer app
    if: github.event_name == 'push' && github.ref == 'refs/heads/app'
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orbite-app-*
          path: built
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          # One of each kind, under a name that says what it is for.
          pick() { find built -name "$1" | sort | head -1; }
          give() { [ -z "$1" ] || cp "$1" "out/$2"; }
          give "$(pick '*-setup.exe')" Orbite-Windows-setup.exe
          give "$(pick '*.msi')" Orbite-Windows.msi
          give "$(pick '*.dmg')" Orbite-macOS.dmg
          give "$(pick '*.AppImage')" Orbite-Linux.AppImage
          give "$(pick '*.deb')" Orbite-Linux.deb
          ls -la out
          gh release delete app-desktop --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create app-desktop out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Orbite for computers" --prerelease --latest=false \
            --notes "Orbite's app for Windows, macOS and Linux, built from the app's branch at ${GITHUB_SHA}. It is a window on the page your agent serves: open it, then paste the link your agent's settings give for a new device. It is not signed yet: Windows and macOS ask you to confirm before opening it."

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo tauri android init
      - run: cargo tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-Android
          path: app/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iPhone (simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # Built here rather than fetched ready-made: the ready-made one is
      # for another processor, and what it then installs refuses to go on.
      - run: cargo install tauri-cli --version "^2" --locked
      - run: brew install xcodegen
      - run: cargo tauri ios init
      - run: cargo tauri ios build --debug --target aarch64-sim
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-iPhone-simulator
          path: app/gen/apple/build/**/*.app
          if-no-files-found: error
