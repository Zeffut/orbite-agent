name: App

# Orbite's app for phones and computers, built for each system it runs on.
on:
  push:
    branches: [app, main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  desktop:
    name: Computer (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.system }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm run tauri android init
      - run: npm run tauri android build -- --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-Android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iPhone (simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: brew install xcodegen
      - run: npm ci
      - run: npm run tauri ios init
      - run: npm run tauri ios build -- --debug --target aarch64-sim
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-app-iPhone-simulator
          path: app/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
