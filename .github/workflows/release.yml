name: Release

# Builds Orbite for the machines it installs on, installs it for real on
# fresh ones, and, for a version tag, publishes it signed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            file: orbite-x86_64-linux
          - target: aarch64-unknown-linux-musl
            file: orbite-aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Zig links against musl, so that one program runs on every Linux.
      - run: pip install --quiet ziglang cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/orbite ${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  install:
    name: Install on ${{ matrix.system }} (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every system the installer says it supports, each fresh, on both
        # kinds of processor. "this machine" is the runner itself, a full
        # Ubuntu; the others are machines of their own, started from the
        # system's published image with nothing but systemd added.
        arch: [x86_64, aarch64]
        system:
          - this machine
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
        include:
          # Derived from Debian, and installed as Debian is.
          - arch: x86_64
            system: kalilinux/kali-rolling
          - arch: x86_64
            system: linuxmintd/mint22-amd64
          # Systems with other ways of installing packages.
          - arch: x86_64
            system: fedora:latest
          - arch: aarch64
            system: fedora:latest
          - arch: x86_64
            system: almalinux:9
          - arch: x86_64
            system: archlinux:latest
          - arch: x86_64
            system: opensuse/tumbleweed
          # A fresh Debian as its own installer leaves it: wget, and no curl.
          - arch: x86_64
            system: debian:13
            wget_only: "1"
          # Without the Agent's Computer, as an Owner may ask.
          - arch: x86_64
            system: debian:13
            without_computer: "1"
          # A machine set up strictly: files made for their owner only, a
          # /tmp nothing can be run from, and French as its language.
          - arch: x86_64
            system: ubuntu:24.04
            strict: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbite-${{ matrix.arch }}-linux
          path: release
      # A release like the published one, signed with a key made for this run.
      - name: Make a release to install from
        run: |
          cd release
          FILE=orbite-${{ matrix.arch }}-linux
          chmod +x "$FILE"
          "./$FILE" version | cut -d' ' -f2 > VERSION
          sha256sum "$FILE" VERSION > SHA256SUMS
          openssl genpkey -algorithm ed25519 -out ../try.key
          openssl pkey -in ../try.key -pubout -out try.pub
          openssl pkeyutl -sign -inkey ../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          cp ../install.sh ../.github/try-install.sh ../.github/try-server.sh ../.github/fake-telegram.py .
          # Two later releases to update to: one that works, one that does not start.
          release() {
            (cd "$1" && echo "$2" > VERSION && sha256sum "$FILE" VERSION > SHA256SUMS &&
              openssl pkeyutl -sign -inkey ../../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig)
          }
          mkdir next broken
          cp "$FILE" next/ && release next 99.0.0
          printf '#!/bin/sh\nexit 1\n' > "broken/$FILE" && release broken 99.1.0
      - name: Install and try the service (this machine)
        if: matrix.system == 'this machine'
        run: sudo sh release/try-install.sh "$PWD/release"
      - name: Become a server that holds its agent in a container (this machine)
        if: matrix.system == 'this machine'
        run: |
          sudo cp /var/lib/orbite/computer/check.png "$RUNNER_TEMP/computer-check.png" 2>/dev/null || true
          sudo sh release/try-server.sh "$PWD/release"
      - name: Keep what the Computer saw
        if: always() && matrix.system == 'this machine'
        run: sudo cp /var/lib/orbite/computer/check.png "$RUNNER_TEMP/computer-check.png" 2>/dev/null || true
      - if: always() && matrix.system == 'this machine'
        uses: actions/upload-artifact@v4
        with:
          name: computer-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/computer-check.png
          if-no-files-found: ignore
      - name: Install and try the service (a machine of its own)
        if: matrix.system != 'this machine'
        run: |
          # The system as published, with systemd to make a machine of it and
          # what the trial itself uses; the installer brings the rest.
          # (Each family names these differently; python3 serves the trial's
          # stand-in for Telegram.)
          case '${{ matrix.system }}' in
            fedora*|almalinux*) ADD='dnf install -y -q systemd procps-ng python3 util-linux findutils' ;;
            archlinux*) ADD='pacman -Syu --noconfirm --needed systemd procps-ng python util-linux findutils' ;;
            opensuse*) ADD='zypper --non-interactive install systemd procps python3 util-linux findutils' ;;
            *) ADD='apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv procps python3 ${{ matrix.wget_only && 'wget' || '' }}' ;;
          esac
          printf 'FROM %s\nRUN %s >/dev/null\nCMD ["/usr/lib/systemd/systemd"]\n' '${{ matrix.system }}' "$ADD" > Dockerfile.fresh
          docker build -q -t fresh -f Dockerfile.fresh .
          docker run -d --name fresh --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw fresh
          sleep 5
          docker cp release fresh:/release
          if [ -n '${{ matrix.strict }}' ]; then
            docker exec fresh mount -t tmpfs -o noexec,nosuid tmpfs /tmp
            docker exec -e LANG=fr_FR.UTF-8 -e LC_ALL=fr_FR.UTF-8 fresh sh -c 'umask 077; sh /release/try-install.sh /release'
          else
            docker exec -e ORBITE_WITHOUT_COMPUTER='${{ matrix.without_computer }}' -e TRY_WITH_WGET_ONLY='${{ matrix.wget_only }}' fresh sh /release/try-install.sh /release
          fi

  # Real machines: each system's own published image, started untouched in
  # a virtual machine, with nothing added before the installer runs. Then
  # the machine is restarted, and Orbite must be back by itself.
  machine:
    name: Install on a real ${{ matrix.system }} machine
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Debian 13
            server: "1"
            image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - system: Debian 12
            image: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
          - system: Ubuntu 24.04
            server: "1"
            image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - system: Ubuntu 26.04
            image: https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img
          - system: Fedora
            folder: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/
            named: 'Fedora-Cloud-Base-Generic-[0-9.-]*\.x86_64\.qcow2'
          - system: AlmaLinux 9
            image: https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          - system: Arch
            image: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
          - system: openSUSE Tumbleweed
            image: https://download.opensuse.org/tumbleweed/appliances/openSUSE-Tumbleweed-Minimal-VM.x86_64-Cloud.qcow2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbite-x86_64-linux
          path: release
      - name: Make a release to install from
        run: |
          cd release
          FILE=orbite-x86_64-linux
          chmod +x "$FILE"
          "./$FILE" version | cut -d' ' -f2 > VERSION
          sha256sum "$FILE" VERSION > SHA256SUMS
          openssl genpkey -algorithm ed25519 -out ../try.key
          openssl pkey -in ../try.key -pubout -out try.pub
          openssl pkeyutl -sign -inkey ../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          cp ../install.sh ../.github/try-install.sh ../.github/try-server.sh ../.github/fake-telegram.py .
          release() {
            (cd "$1" && echo "$2" > VERSION && sha256sum "$FILE" VERSION > SHA256SUMS &&
              openssl pkeyutl -sign -inkey ../../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig)
          }
          mkdir next broken
          cp "$FILE" next/ && release next 99.0.0
          printf '#!/bin/sh\nexit 1\n' > "broken/$FILE" && release broken 99.1.0
      - name: What starts the machine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - name: Start the machine, install, try the service, restart the machine
        run: |
          IMAGE='${{ matrix.image }}'
          if [ -z "$IMAGE" ]; then
            FOLDER='${{ matrix.folder }}'
            IMAGE="$FOLDER$(curl -fsSL "$FOLDER" | grep -o '${{ matrix.named }}' | sort -u | tail -1)"
          fi
          TRY_SERVER='${{ matrix.server }}' sh .github/try-on-a-machine.sh "$IMAGE" "$PWD/release"

  # Where Orbite cannot be installed, the installer says why and changes nothing.
  refuse:
    name: Refuse ${{ matrix.system }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # No systemd, which Orbite's service needs.
          - system: alpine:latest
            says: systemd is not running
          # A supported system that is no machine: nothing runs services.
          - system: debian:13
            says: systemd is not running
          # Too old to check the release's signature: said before anything
          # is fetched. (Debian 11's own packages are no longer served, so
          # no machine can be made of it here; Ubuntu 20.04 stands for both.)
          - system: ubuntu:20.04
            systemd: "1"
            says: is too old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbite-x86_64-linux
          path: release
      - name: Make a release to install from
        run: |
          cd release
          chmod +x orbite-x86_64-linux
          ./orbite-x86_64-linux version | cut -d' ' -f2 > VERSION
          sha256sum orbite-x86_64-linux VERSION > SHA256SUMS
          openssl genpkey -algorithm ed25519 -out ../try.key
          openssl pkey -in ../try.key -pubout -out try.pub
          openssl pkeyutl -sign -inkey ../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          cp ../install.sh .
      - name: The installer refuses, says why, and leaves the machine as it was
        run: |
          if [ -n '${{ matrix.systemd }}' ]; then
            printf 'FROM %s\nRUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv >/dev/null\nCMD ["/sbin/init"]\n' '${{ matrix.system }}' > Dockerfile.old
            docker build -q -t old -f Dockerfile.old .
            docker run -d --name machine --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw old
          else
            docker run -d --name machine '${{ matrix.system }}' sleep 600
          fi
          sleep 5
          docker cp release machine:/release
          set +e
          said=$(docker exec -e ORBITE_RELEASE_URL=file:///release -e ORBITE_SIGNING_KEY="$(cat release/try.pub)" -e ORBITE_SKIP_SETUP=1 machine sh /release/install.sh 2>&1)
          code=$?
          set -e
          printf '%s\n' "$said"
          [ "$code" -ne 0 ] || { echo "it was installed" >&2; exit 1; }
          printf '%s' "$said" | grep -q 'Orbite was not installed' || { echo "it did not say it was not installed" >&2; exit 1; }
          printf '%s' "$said" | grep -q '${{ matrix.says }}' || { echo "it did not say why" >&2; exit 1; }
          docker exec machine sh -c '[ ! -e /usr/local/bin/orbite ] && [ ! -e /etc/systemd/system/orbite.service ] && [ ! -e /var/lib/orbite ] && ! id orbite >/dev/null 2>&1' || { echo "something was left on the machine" >&2; exit 1; }

  # Not as root: refused before anything is asked of the machine.
  refuse-without-root:
    name: Refuse to install without root
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          said=$(sh install.sh 2>&1); code=$?
          set -e
          printf '%s\n' "$said"
          [ "$code" -ne 0 ] && printf '%s' "$said" | grep -q 'must be run as root'
          [ ! -e /usr/local/bin/orbite ]

  publish:
    name: Publish the version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install, machine, refuse, refuse-without-root]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir release
          cp artifacts/*/orbite-*-linux install.sh release/
          cd release
          # The version a program says it is must be the one it is published
          # as, or it would update to itself for ever.
          chmod +x orbite-x86_64-linux
          ./orbite-x86_64-linux version | cut -d' ' -f2 > VERSION
          [ "$(cat VERSION)" = "${GITHUB_REF_NAME#v}" ] || { echo "Cargo.toml says $(cat VERSION), the tag says ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          sha256sum orbite-*-linux install.sh VERSION > SHA256SUMS
          printf '%s\n' "$RELEASE_SIGNING_KEY" > ../signing.key
          openssl pkeyutl -sign -inkey ../signing.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm ../signing.key
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Orbite is in early development: versions before 1.0 are for trying it out, and things will change.

          Install on any Linux with systemd (x86_64 or aarch64), freshly installed, with nothing to prepare:

          ```sh
          curl -fsSL https://github.com/Zeffut/orbite-agent/releases/latest/download/install.sh | sudo sh
          ```

          The installer checks that what it downloads is signed by Orbite's key before installing it.
          NOTES
          gh release create "${GITHUB_REF_NAME}" release/* --title "Orbite ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
