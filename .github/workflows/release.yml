name: Release

# Builds Orbite for the machines it installs on, installs it for real on
# fresh ones, and, for a version tag, publishes it signed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            file: orbite-x86_64-linux
          - target: aarch64-unknown-linux-musl
            file: orbite-aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Zig links against musl, so that one program runs on every Linux.
      - run: pip install --quiet ziglang cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/orbite ${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  install:
    name: Install on a fresh ${{ matrix.system }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu, debian]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbite-x86_64-linux
          path: release
      # A release like the published one, signed with a key made for this run.
      - name: Make a release to install from
        run: |
          cd release
          sha256sum orbite-x86_64-linux > SHA256SUMS
          openssl genpkey -algorithm ed25519 -out ../try.key
          openssl pkey -in ../try.key -pubout -out try.pub
          openssl pkeyutl -sign -inkey ../try.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          cp ../install.sh ../.github/try-install.sh .
      - name: Install and try the service (Ubuntu, this machine)
        if: matrix.system == 'ubuntu'
        run: sudo sh release/try-install.sh "$PWD/release"
      - name: Install and try the service (Debian, a machine of its own)
        if: matrix.system == 'debian'
        run: |
          printf 'FROM debian:stable\nRUN apt-get update -qq && apt-get install -y -qq systemd systemd-sysv procps >/dev/null\nCMD ["/sbin/init"]\n' > Dockerfile.debian
          docker build -q -t fresh-debian -f Dockerfile.debian .
          docker run -d --name fresh --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw fresh-debian
          sleep 5
          docker cp release fresh:/release
          docker exec fresh sh /release/try-install.sh /release

  publish:
    name: Publish the version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir release
          cp artifacts/*/orbite-*-linux install.sh release/
          cd release
          sha256sum orbite-*-linux install.sh > SHA256SUMS
          printf '%s\n' "$RELEASE_SIGNING_KEY" > ../signing.key
          openssl pkeyutl -sign -inkey ../signing.key -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm ../signing.key
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Orbite is in early development: versions before 1.0 are for trying it out, and things will change.

          Install on Debian or Ubuntu (x86_64 or aarch64):

          ```sh
          curl -fsSL https://github.com/Zeffut/orbite-agent/releases/latest/download/install.sh | sudo sh
          ```

          The installer checks that what it downloads is signed by Orbite's key before installing it.
          NOTES
          gh release create "${GITHUB_REF_NAME}" release/* --title "Orbite ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
