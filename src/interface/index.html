<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Orbite</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-touch.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbite">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main id="pairing" hidden>
  <form id="pair">
    <img src="/icon.svg" alt="" width="56" height="56">
    <h1 data-say="pairTitle"></h1>
    <p data-say="pairHow"></p>
    <code class="command">sudo orbite pair</code>
    <label><span data-say="pairCode"></span>
      <input id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH" maxlength="9" required></label>
    <label><span data-say="pairName"></span>
      <input id="device" maxlength="60" required></label>
    <button data-say="pairGo"></button>
    <p id="pairWrong" class="wrong" hidden data-say="pairWrong"></p>
  </form>
</main>
<nav id="side" hidden></nav>
<section id="panel" hidden></section>
<main id="talk" hidden>
  <header>
    <span id="link" data-say="offline" hidden></span>
    <div id="who"><svg class="mascot" viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><g transform="rotate(-24 50 50)"><ellipse class="ring" cx="50" cy="50" rx="44" ry="13"/></g><circle class="body" cx="50" cy="50" r="27"/><g class="eyes"><rect x="40" y="38" width="6" height="13" rx="3"/><rect x="54" y="38" width="6" height="13" rx="3"/></g><g transform="rotate(-24 50 50)"><circle class="moon" r="7"/></g><circle class="dot" cx="84" cy="18" r="10"/></svg><strong id="title">Orbite</strong></div>
  </header>
  <section id="said" aria-live="polite"></section>
  <div id="foot">
    <button id="down" type="button" class="round" aria-label="Latest" data-label="latest" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <p id="doing" hidden></p>
    <p id="note" role="status" hidden></p>
    <div id="attached" hidden></div>
    <form id="say">
      <label id="attach" class="round quiet" data-label="attach" aria-label="Attach" tabindex="0"><input id="files" type="file" multiple hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></label>
      <textarea id="text" rows="1" enterkeyhint="send"></textarea>
      <span id="held" hidden><span id="heldTime">0:00</span><span id="heldHint"></span></span>
      <button id="mic" type="button" class="round bright" aria-label="Record" data-label="record" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="send" class="round bright" aria-label="Send" data-label="send"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <div id="recording" hidden>
      <button id="recordStop" type="button" class="round quiet" aria-label="Cancel" data-label="cancel"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span id="recordTime" aria-live="off">0:00</span>
      <button id="recordSend" type="button" class="round bright" aria-label="Send" data-label="send"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</main>
<script src="/app.js"></script>
<script src="/desk.js"></script>
</body>
</html>
