name: Orbite
options:
  bundleIdPrefix: io.github.zeffut
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Orbite:
    type: application
    platform: iOS
    sources: [Orbite]
    info:
      path: Orbite/Info.plist
      properties:
        CFBundleDisplayName: Orbite
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: To read the code your agent shows, so that this device is let in.
        NSMicrophoneUsageDescription: To record the voice messages you send your agent.
        NSSpeechRecognitionUsageDescription: To write down what you say, on this phone, before it is sent to your agent.
        NSLocalNetworkUsageDescription: To reach your agent when it is on your own network.
        # An agent on the Owner's own private network is reached as it serves itself.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zeffut.orbite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
