[package]
name = "orbite-app"
version = "0.1.0"
description = "Orbite on a phone and a computer: the Conversation with your agent"
license = "AGPL-3.0-or-later"
edition = "2024"

[workspace]
members = ["core"]

[lib]
# Named apart from the program: both would otherwise clash on Windows.
name = "orbite_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbite-app-core = { path = "core" }
tauri = { version = "2", features = [] }
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
