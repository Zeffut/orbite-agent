[package]
name = "orbite"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "An open-source, self-hosted personal AI agent that lives on your own machine."
repository = "https://github.com/Zeffut/orbite-agent"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
croner = "4.0.3"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
html2text = "0.17.4"
libc = "0.2.191"
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "multipart"] }
rpassword = "7.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "time", "process"] }
url = "2.5.8"

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
