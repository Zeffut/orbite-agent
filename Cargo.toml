[package]
name = "orbite"
version = "0.5.16"
edition = "2024"
license = "AGPL-3.0-only"
description = "An open-source, self-hosted personal AI agent that lives on your own machine."
repository = "https://github.com/Zeffut/orbite-agent"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
croner = "4.0.3"
ed25519-dalek = "3.0.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
html2text = "0.17.4"
libc = "0.2.191"
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "multipart"] }
rpassword = "7.5.5"
rquickjs = "0.14.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "time", "process", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
url = "2.5.8"
x11rb = { version = "0.14.0", features = ["xtest"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

# Enough to say where something went wrong, without the full debugging
# information: with some fifty test programs it took gigabytes of disk.
[profile.dev]
debug = "line-tables-only"

